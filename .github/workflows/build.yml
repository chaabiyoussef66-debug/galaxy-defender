name: Build Galaxy Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build-doctor

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "Cython==3.1.2"

      - name: Check environment
        run: |
          python --version
          cython --version
          buildozer --version
          java -version

      - name: Verify local pygame recipe
        run: |
          test -f p4a-recipes/pygame/__init__.py
          grep -n "2.6.1" p4a-recipes/pygame/__init__.py
          grep -n "p4a.local_recipes" buildozer.spec

      - name: Build Android APK
        shell: bash
        run: |
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          result=${PIPESTATUS[1]}
          echo "Build exit code: $result"
          exit "$result"

      - name: Diagnose failed build
        if: failure()
        run: |
          python tools/build_doctor.py build.log

      - name: Upload Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Build-Doctor-Report
          path: doctor-report.md
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-Build-Log
          path: build.log
          if-no-files-found: ignore
