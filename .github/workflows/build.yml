name: Build Galaxy Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build-doctor
      - galaxy-defender-3.0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install "Cython==0.29.37"

      - name: Check environment
        run: |
          python --version
          cython --version
          buildozer --version
          java -version

      - name: Verify local Android recipes
        run: |
          test -f p4a-recipes/pygame/__init__.py
          grep -n "2.6.1" p4a-recipes/pygame/__init__.py
          test -f p4a-recipes/openssl/__init__.py
          grep -n "mirror.math.princeton.edu/pub/openssl/source" p4a-recipes/openssl/__init__.py
          test -f p4a-recipes/sdl2_image/__init__.py
          grep -n "www.libsdl.org/projects/SDL_image/release" p4a-recipes/sdl2_image/__init__.py
          test -f p4a-recipes/sdl2/__init__.py
          grep -n "www.libsdl.org/release/SDL2-" p4a-recipes/sdl2/__init__.py
          grep -n "cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8" p4a-recipes/openssl/__init__.py
          grep -n "p4a.local_recipes" buildozer.spec

      - name: Preflight verified OpenSSL mirror
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openssl-1.1.1w.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "https://mirror.math.princeton.edu/pub/openssl/source/openssl-1.1.1w.tar.gz" --output "$archive"
          echo "cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8  $archive" | sha256sum --check
          rm -f "$archive"

      - name: Preflight official SDL2 source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/SDL2-2.28.5.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "https://www.libsdl.org/release/SDL2-2.28.5.tar.gz" --output "$archive"
          echo "a344eb827a03045c9b399e99af4af13d  $archive" | md5sum --check
          tar -tzf "$archive" >/dev/null
          echo "Official SDL2 archive downloaded, checksum-verified, and validated."
          rm -f "$archive"

      - name: Preflight official SDL2_mixer source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/SDL2_mixer-2.6.3.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz" --output "$archive"
          tar -tzf "$archive" >/dev/null
          echo "Official SDL2_mixer archive downloaded and validated."
          rm -f "$archive"

      - name: Preflight official SDL2_image source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/SDL2_image-2.8.0.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 "https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.8.0.tar.gz" --output "$archive"
          tar -tzf "$archive" >/dev/null
          echo "Official SDL2_image archive downloaded and validated."
          rm -f "$archive"

      - name: Prepare Gradle distribution cache
        shell: bash
        run: |
          set -euo pipefail
          version="8.0.2"
          distribution="gradle-${version}-all"
          wrapper_url="https://services.gradle.org/distributions/${distribution}.zip"
          expected_sha256="47a5bfed9ef814f90f8debcbbb315e8e7c654109acd224595ea39fca95c5d4da"
          cache_root="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/${distribution}"
          url_hash="$(printf '%s' "$wrapper_url" | md5sum | cut -d' ' -f1)"
          cache_dir="$cache_root/$url_hash"
          mkdir -p "$cache_dir"
          archive="$cache_dir/${distribution}.zip"
          mirrors=(
            "https://repo.huaweicloud.com/repository/toolkit/gradle/${distribution}.zip"
            "https://mirrors.aliyun.com/gradle/distributions/v${version}/${distribution}.zip"
            "https://mirror.nju.edu.cn/gradle/${distribution}.zip"
          )
          downloaded=0
          for mirror in "${mirrors[@]}"; do
            echo "Trying Gradle mirror: $mirror"
            rm -f "$archive"
            if curl --fail --location --connect-timeout 20 --max-time 900 --retry 2 --retry-all-errors --retry-delay 3 "$mirror" --output "$archive"; then
              actual_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
              if [[ "$actual_sha256" == "$expected_sha256" ]] && unzip -tq "$archive"; then
                downloaded=1
                echo "Gradle archive checksum and ZIP integrity verified."
                break
              fi
              echo "Mirror returned an invalid archive or checksum; trying the next mirror."
            else
              echo "Mirror download failed; trying the next mirror."
            fi
          done
          if [[ "$downloaded" -ne 1 ]]; then
            echo "::error::Could not download a verified Gradle ${version} distribution from any configured mirror."
            exit 1
          fi
          unzip -q "$archive" -d "$cache_dir"
          test -x "$cache_dir/gradle-${version}/bin/gradle"
          touch "$cache_dir/${distribution}.zip.ok"
          echo "Gradle ${version} cached for the Gradle wrapper."

      - name: Build Android APK
        shell: bash
        run: |
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          result=${PIPESTATUS[1]}
          echo "Build exit code: $result"
          exit "$result"

      - name: Diagnose failed build
        if: failure()
        run: |
          python tools/build_doctor.py build.log

      - name: Upload Doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Build-Doctor-Report
          path: doctor-report.md
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Defender-Build-Log
          path: build.log
          if-no-files-found: ignore
